org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 defaults to a new DSL + built-in Kotlin. Keep the existing Groovy/
# org.jetbrains.kotlin.android setup until a full migration.
android.newDsl=false
android.builtInKotlin=false

# Keep current packaging / R8 behavior while on the transitional flags above.
android.r8.strictFullModeForKeepRules=false

# Android Studio Quail tooling init scripts break under Configuration Cache
# (MissingPropertyException: com / ClosureCodec$BrokenScript).
org.gradle.configuration-cache=false
org.gradle.configuration-cache.parallel=false
