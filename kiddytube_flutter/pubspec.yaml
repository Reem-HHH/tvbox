name: kiddytube
description: Cross-platform KiddyTube (Android phone, Android TV, iPad / iOS).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.7.0
  webview_flutter_wkwebview: ^3.22.0
  video_player: ^2.10.0
  crypto: ^3.0.6
  http: ^1.4.0
  share_plus: ^11.0.0
  wakelock_plus: ^1.5.2
  cached_network_image: ^3.4.1
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/kiddytube_logo.png
    - assets/kiddytube_logo_full.png
