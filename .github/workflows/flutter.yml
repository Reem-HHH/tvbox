name: Flutter

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kiddytube_flutter/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'kiddytube_flutter/**'
      - '.github/workflows/flutter.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiddytube_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned near repo bootstrap (.tools/flutter 3.44.x / Dart 3.12).
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
