name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Unit tests
        run: ./gradlew test
        working-directory: KiddyTube
      - name: Lint
        run: ./gradlew lintDebug
        working-directory: KiddyTube
      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: KiddyTube
      - uses: actions/upload-artifact@v4
        with:
          name: KiddyTube-debug-apk
          path: KiddyTube/app/build/outputs/apk/debug/app-debug.apk
