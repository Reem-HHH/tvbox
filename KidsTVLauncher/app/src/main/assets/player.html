<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Kids TV</title>
  <style>
    html, body, #player {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    html, body {
      cursor: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    /* The player is controlled only through the physical remote and IFrame API. */
    #player iframe {
      display: block;
      width: 100% !important;
      height: 100% !important;
      border: 0;
      pointer-events: none;
    }

    #error {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 48px;
      box-sizing: border-box;
      color: #f2f2f2;
      font: 28px/1.4 system-ui, sans-serif;
      text-align: center;
      background: #000;
      z-index: 2;
    }

    #error.visible {
      display: flex;
    }
  </style>
</head>
<body>
  <div id="player"></div>
  <div id="error" role="alert" aria-live="polite"></div>

  <script>
    let player = null;
    let channels = [];
    let currentChannel = 0;
    let ready = false;
    let autoplayRecoveryAttempted = false;
    let loadGeneration = 0;
    let consecutiveErrors = 0;
    let failedChannelAttempts = 0;
    const MAX_VIDEO_ERRORS = 3;
    const MAX_CHANNEL_FAILURES = 4;

    function showError(message) {
      const el = document.getElementById('error');
      el.textContent = message;
      el.classList.add('visible');
    }

    function hideError() {
      const el = document.getElementById('error');
      el.textContent = '';
      el.classList.remove('visible');
    }

    async function loadConfiguration() {
      const response = await fetch('channels.json', { cache: 'no-store' });
      if (!response.ok) throw new Error('Could not load channels.json');
      const config = await response.json();
      channels = config.channels || [];
      if (!channels.length) throw new Error('No channels configured');
    }

    function onYouTubeIframeAPIReady() {
      loadConfiguration().then(() => {
        hideError();
        const first = channels[0];
        player = new YT.Player('player', {
          width: '100%',
          height: '100%',
          playerVars: {
            autoplay: 1,
            controls: 0,
            disablekb: 1,
            fs: 0,
            iv_load_policy: 3,
            listType: 'playlist',
            list: first.playlistId,
            loop: 1,
            playsinline: 1,
            rel: 0,
            hl: 'ar',
            origin: window.location.origin
          },
          events: {
            onReady: onPlayerReady,
            onStateChange: onPlayerStateChange,
            onError: onPlayerError,
            onAutoplayBlocked: recoverAutoplay
          }
        });
      }).catch(error => {
        console.error('Configuration error', error);
        showError('Unable to load Kids TV. Check the network and try again.');
      });
    }

    function onPlayerReady(event) {
      ready = true;
      hideError();
      event.target.setLoop(true);

      const iframe = document.querySelector('#player iframe');
      if (iframe) {
        iframe.tabIndex = -1;
        iframe.style.pointerEvents = 'none';
      }

      scheduleRandomize(true);
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        autoplayRecoveryAttempted = false;
        consecutiveErrors = 0;
        failedChannelAttempts = 0;
        hideError();
        if (player.isMuted()) player.unMute();
      } else if (event.data === YT.PlayerState.ENDED) {
        nextVideo();
      }
    }

    function onPlayerError(event) {
      console.warn('Skipping unavailable video', event.data);
      consecutiveErrors += 1;
      if (consecutiveErrors >= MAX_VIDEO_ERRORS) {
        consecutiveErrors = 0;
        failedChannelAttempts += 1;
        if (failedChannelAttempts >= Math.min(MAX_CHANNEL_FAILURES, Math.max(1, channels.length))) {
          showError('Playback unavailable. Try again later or check the playlists.');
          return;
        }
        setTimeout(() => nextChannel(), 500);
        return;
      }
      const generation = loadGeneration;
      setTimeout(() => {
        if (generation !== loadGeneration) return;
        nextVideo();
      }, 500);
    }

    function recoverAutoplay() {
      if (!ready || autoplayRecoveryAttempted) return;
      autoplayRecoveryAttempted = true;
      player.mute();
      player.playVideo();
    }

    function scheduleRandomize(playNow) {
      const generation = ++loadGeneration;
      setTimeout(() => {
        if (generation !== loadGeneration) return;
        randomizeCurrentPlaylist(playNow);
      }, 300);
    }

    function randomizeCurrentPlaylist(playNow) {
      if (!ready || !player) return;
      player.setLoop(true);
      player.setShuffle(true);
      const list = player.getPlaylist() || [];
      if (!list.length) return;
      const index = Math.floor(Math.random() * list.length);
      if (playNow) player.playVideoAt(index);
    }

    function switchChannel(index) {
      if (!ready || !channels.length) return;
      currentChannel = (index + channels.length) % channels.length;
      const channel = channels[currentChannel];
      consecutiveErrors = 0;
      hideError();
      loadGeneration += 1;
      player.loadPlaylist({
        listType: 'playlist',
        list: channel.playlistId,
        index: 0,
        startSeconds: 0
      });
      const generation = loadGeneration;
      setTimeout(() => {
        if (generation !== loadGeneration) return;
        scheduleRandomize(true);
      }, 600);
    }

    function nextChannel() { switchChannel(currentChannel + 1); }
    function previousChannel() { switchChannel(currentChannel - 1); }

    function nextVideo() {
      if (!ready) return;
      player.nextVideo();
      player.playVideo();
    }

    function previousVideo() {
      if (!ready) return;
      player.previousVideo();
      player.playVideo();
    }

    // Clean mode intentionally does not pause. Pausing makes YouTube display
    // title/channel information. OK simply starts playback if it was blocked.
    function ensurePlaying() {
      if (!ready) return;
      hideError();
      const state = player.getPlayerState();
      if (state !== YT.PlayerState.PLAYING) player.playVideo();
    }

    function pauseForParentMenu() {
      if (ready && player.getPlayerState() === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      }
    }

    function changePlayerVolume(delta) {
      if (!ready) return;
      const next = Math.max(0, Math.min(100, player.getVolume() + delta));
      player.setVolume(next);
    }

    // Desktop preview controls. Android TV remote keys are handled natively.
    document.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') ensurePlaying();
      else if (event.key === 'ArrowRight') nextVideo();
      else if (event.key === 'ArrowLeft') previousVideo();
      else if (event.key === 'ArrowUp') changePlayerVolume(5);
      else if (event.key === 'ArrowDown') changePlayerVolume(-5);
      else if (event.key === 'PageUp') nextChannel();
      else if (event.key === 'PageDown') previousChannel();
      else if (/^[1-4]$/.test(event.key)) switchChannel(Number(event.key) - 1);
      else return;
      event.preventDefault();
    });

    document.addEventListener('contextmenu', event => event.preventDefault());

    const api = document.createElement('script');
    api.src = 'https://www.youtube.com/iframe_api';
    api.onerror = () => showError('Unable to reach YouTube. Check the network and try again.');
    document.head.appendChild(api);

    // Surface a delayed hint when the IFrame API never becomes ready.
    setTimeout(() => {
      if (!ready && !document.getElementById('error').classList.contains('visible')) {
        showError('Waiting for playback… If this stays blank, check network or WebView updates.');
      }
    }, 15000);
  </script>
</body>
</html>
