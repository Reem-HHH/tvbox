plugins {
    id 'com.android.application'
}

android {
    namespace 'ae.kidstv.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'ae.kidstv.launcher'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '0.2.0-clean'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
